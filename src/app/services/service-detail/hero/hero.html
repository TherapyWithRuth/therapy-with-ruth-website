<section class="detail-hero" aria-labelledby="service-title">
  <div class="detail-hero__content">
    <p class="detail-hero__eyebrow">{{ service().eyebrow }}</p>
    <h1 id="service-title">{{ service().title }}</h1>
    <p class="detail-hero__intro">{{ service().intro }}</p>
    <a class="detail-hero__link" [routerLink]="[]" fragment="concerns">What We Can Explore</a>
  </div>

  <div class="detail-hero__art" aria-hidden="true"><span></span><span></span><span></span></div>
</section>
