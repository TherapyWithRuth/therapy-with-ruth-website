<section class="faq" aria-labelledby="faq-title">
  <div class="faq__content">
    <h2 id="faq-title">Frequently Asked Questions</h2>

    @if (faqItems$ | async; as faqItems) {
      <dl class="faq__list">
        @for (item of faqItems; track item.question) {
          <div class="faq__item">
            <dt><span aria-hidden="true">Q:</span> {{ item.question }}</dt>
            <dd><span aria-hidden="true">A:</span> {{ item.answer }}</dd>
          </div>
        }
      </dl>
    }

    <a class="faq__button" routerLink="/faq">See More</a>
  </div>
</section>
