<section class="getting-started" aria-labelledby="getting-started-title">
  <div class="getting-started__content">
    <h2 id="getting-started-title">Getting Started is Simple</h2>

    <div class="getting-started__details">
      <ol class="getting-started__steps">
        @for (step of steps; track step) {
          <li>{{ step }}</li>
        }
      </ol>

      <div class="getting-started__graphic" aria-hidden="true">
        <span>Graphic placeholder</span>
      </div>
    </div>
  </div>
</section>
